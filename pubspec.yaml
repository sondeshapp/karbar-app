name: m_pos
description: "Karbar POS application."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  mobile_scanner: ^7.4.0
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.4
  path_provider: ^2.1.3
  path: ^1.9.0
  pdf: ^3.11.0
  printing: ^5.13.0
  go_router: ^14.0.0
  flutter_riverpod: ^2.5.1
  intl: ^0.20.3
  crypto: ^3.0.7
  flutter_secure_storage: ^11.2.0
  image_picker: ^1.1.0
  image: ^4.9.1
  workmanager: ^0.7.0
  file_selector: ^1.1.0
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/karbar_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/karbar_logo.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  web:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - assets/karbar_logo.png
    - assets/onboarding_market_pattern.png
